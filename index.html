<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доска формул</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=STIX+Two+Text:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fa;--card:#fff;--ink:#211d36;--mut:#6f6a88;--acc:#d4156b;--onacc:#fff;--soft:#ffe6f0;--line:#e5e1f0;--key:#efecf8;--keyh:#e3def2;--dot:#cfc9e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2e;--ink:#f1eef8;--mut:#a29cb8;--acc:#ff5c9b;--onacc:#1d0b16;--soft:#3a1f2f;--line:#352f45;--key:#2c2739;--keyh:#383247;--dot:#3a3449}}
:root[data-theme="dark"]{--bg:#17141f;--card:#221e2e;--ink:#f1eef8;--mut:#a29cb8;--acc:#ff5c9b;--onacc:#1d0b16;--soft:#3a1f2f;--line:#352f45;--key:#2c2739;--keyh:#383247;--dot:#3a3449}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
#board{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;overscroll-behavior:none;touch-action:none;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.reg{position:absolute;white-space:nowrap;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;font:500 30px/1.35 "STIX Two Text","Cambria Math",serif;cursor:grab;user-select:none;-webkit-user-select:none}
.reg.on{border-color:var(--acc);box-shadow:0 0 0 4px var(--soft);cursor:text}
.x{position:absolute;top:-13px;right:-13px;width:26px;height:26px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font:800 16px/1 Nunito,sans-serif;cursor:pointer}
.rv{color:var(--acc);margin-left:.3em}
.er{font:600 13px Nunito,sans-serif;color:var(--acc);margin-top:-2px}
.bar{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.bar h1{margin:0;font-size:20px;font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.tools{display:flex;gap:6px}
.tools button{height:38px;min-width:38px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:800 18px Nunito,sans-serif;cursor:pointer}
.tools .pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-size:15px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,560px);transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;gap:6px;z-index:6;box-shadow:0 -6px 24px rgba(20,10,40,.12)}
.sheet:not(.open){visibility:hidden}
.kg{display:grid;gap:6px;grid-template-columns:repeat(var(--c),1fr)}
.kg[hidden]{display:none}
.kg button{height:44px;border:0;border-radius:12px;background:var(--key);color:var(--ink);font:800 19px Nunito,sans-serif;cursor:pointer;padding:0}
.kg button:hover{background:var(--keyh)}
.kg .o{color:var(--acc)}.kg .sm{font-size:14px}.kg .ok{background:var(--acc);color:var(--onacc)}
.kg .fr{font-size:.7em}
.row{display:inline-flex;align-items:center;border-radius:6px}
.row.e{min-width:.7em;min-height:1em;outline:1.5px dashed var(--mut);outline-offset:-1px}
.row.on{background:var(--soft)}
.ef{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;margin:0 .15em}
.ef>.row{justify-content:center;padding:0 .15em}
.ef>.row:first-child{border-bottom:2px solid currentColor;border-radius:0}
.ef .ef{font-size:.85em}
.sp{font-size:.65em;vertical-align:super;display:inline-flex;margin-left:.05em}
.op{margin:0 .22em}.op.s{margin:0 .12em}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--acc);margin:0 -1px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.caret{animation:bl 1s steps(1) infinite}.sheet{transition:visibility .2s}}
@keyframes bl{50%{opacity:0}}
.ph{font:600 16px Nunito,sans-serif;color:var(--mut)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.2;margin:0 .15em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.rt{white-space:nowrap;display:inline-flex}.ov{border-top:2px solid currentColor;padding:0 .1em;display:inline-flex;min-width:.7em}
sup,sub{font-size:.6em}
.menu{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:7;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;gap:4px;min-width:170px;box-shadow:0 6px 24px rgba(20,10,40,.15)}
.menu[hidden]{display:none}
.menu button{border:0;background:transparent;color:var(--ink);text-align:left;font:800 16px Nunito,sans-serif;padding:10px 12px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--key)}
#ta{width:100%;resize:none;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 16px Nunito,sans-serif;padding:8px 10px}
.tr{display:flex;gap:6px;align-items:center}
.tr select{flex:1;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:600 16px Nunito,sans-serif;padding:0 8px}
.tr button{height:40px;min-width:40px;border:0;border-radius:12px;background:var(--key);color:var(--ink);font:800 16px Nunito,sans-serif;cursor:pointer}
.tr button.on{background:var(--acc);color:var(--onacc)}
.tr span{min-width:2ch;text-align:center}
.txt{white-space:pre;line-height:1.3}
.fig{display:block;max-width:none;border-radius:6px}
.ge{font-size:24px;margin-bottom:4px}
.rs{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--acc);cursor:nwse-resize;touch-action:none}
.gz{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.gz button{width:28px;height:28px;border:0;border-radius:8px;background:var(--key);color:var(--ink);font:800 16px Nunito,sans-serif;cursor:pointer}
.gl{stroke:var(--line);stroke-width:1}.ax{stroke:var(--mut);stroke-width:1.3}.cv{stroke:var(--acc);fill:none;stroke-width:2.4;stroke-linejoin:round}
svg text{fill:var(--mut);font:600 11px Nunito,sans-serif}
.reg img{pointer-events:none}
.toast{position:fixed;left:0;right:0;margin:auto;width:fit-content;max-width:90%;top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--card);border:1.5px solid var(--acc);border-radius:12px;padding:8px 14px;z-index:8;font-size:14px}
.toast[hidden]{display:none}
.reg.tx:not(.on){background:transparent;border-color:transparent}
.pg{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(20,10,40,.08)}
.pg span{position:absolute;right:14px;bottom:10px;color:var(--mut);font:600 12px Nunito,sans-serif}
.mx{display:inline-block;vertical-align:middle;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:8px;padding:0 6px;margin:0 .15em}
.mx table{border-collapse:collapse}
.exp{position:fixed;left:0;top:0;z-index:-1;background:#fff;overflow:hidden;color:#211d36;--card:#fff;--ink:#211d36;--mut:#6f6a88;--acc:#d4156b;--line:#e5e1f0;--soft:#ffe6f0}
.exp .reg{border-color:transparent;background:transparent;box-shadow:none}
.fm{display:block}
.sl{display:block;width:100%;margin:10px 0 2px;accent-color:var(--acc)}
.ai{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);max-height:75vh;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:9;box-shadow:0 -6px 24px rgba(20,10,40,.15)}
.ai[hidden]{display:none}
.aih{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.aih button,.aif button,.air button{border:0;border-radius:12px;background:var(--key);color:var(--ink);font:800 15px Nunito,sans-serif;padding:0 14px;height:38px;cursor:pointer}
.aim{overflow:auto;min-height:60px;flex:1}
.mb{margin:6px 0;padding:8px 12px;border-radius:12px;background:var(--key);white-space:pre-wrap;font-size:15px}
.mb.u{background:var(--soft)}
.aiq{display:flex;flex-wrap:wrap;gap:6px}
.aiq button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 10px;font:600 13px Nunito,sans-serif;cursor:pointer}
.air{display:flex;gap:6px}
.air textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 16px Nunito,sans-serif;padding:8px 10px}
.air button{background:var(--acc);color:var(--onacc);height:auto;min-width:46px}
.aif{display:flex;gap:6px;flex-wrap:wrap}
.aif button[hidden]{display:none}
.aif button:disabled,.air button:disabled{opacity:.5}
#aib{background:linear-gradient(135deg,#7b3fe4,#d4156b);border-color:transparent;color:#fff;font-size:15px}
.mx td{padding:.1em .45em;text-align:center}
.kg button[data-k^="H"],.kg button[data-k^="V"]{font-size:13px}
@media(max-width:560px){.bar h1{display:none}.bar{justify-content:flex-end}}
</style>
</head>
<body>
<div id="board"><div id="world"></div></div>
<div class="bar"><h1>Доска формул</h1><div class="tools"><button id="aib" hidden>✨ ИИ</button><button id="add" class="pri">+ Добавить</button><button id="pp" aria-label="Предыдущая страница">‹</button><button id="pn" aria-label="Страница">1/1</button><button id="pnx" aria-label="Следующая страница">›</button><button id="zo" aria-label="Уменьшить">−</button><button id="zi" aria-label="Увеличить">+</button></div></div>
<div class="sheet" id="sheet"><div id="k1" class="kg" style="--c:5"></div><div id="k2" class="kg" style="--c:7" hidden></div><div id="k4" class="kg" style="--c:7" hidden></div><div id="k6" class="kg" style="--c:6" hidden></div><div id="k5" class="kg" style="--c:6"></div><div id="k3" class="kg" style="--c:6"></div></div>
<div class="sheet" id="tsheet"><textarea id="ta" rows="3" placeholder="Текст" aria-label="Текст"></textarea><div class="tr"><select id="ff" aria-label="Шрифт"><option>Nunito</option><option>STIX Two Text</option><option>Georgia</option><option>Arial</option><option>Courier New</option></select><button data-s="-" aria-label="Меньше">A−</button><span id="sz">22</span><button data-s="+" aria-label="Больше">A+</button><button id="bb" aria-label="Жирный"><b>B</b></button><button id="ii" aria-label="Курсив"><i>I</i></button><button id="td" aria-label="Готово">✓</button></div></div>
<div class="menu" id="menu" hidden><button data-a="f">Формула</button><button data-a="t">Текст</button><button data-a="g">График</button><button data-a="i">Изображение</button><button data-a="p">Новая страница</button><button data-a="x">Импорт .xmcd</button><button data-a="ex">Экспорт .xmcd</button><button data-a="ep">Экспорт PDF</button></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="xf" hidden>
<div class="toast" id="toast" hidden></div>
<div class="ai" id="ai" hidden><div class="aih"><b>✨ ИИ-инженер</b><button id="aix" aria-label="Закрыть">✕</button></div><div class="aim" id="aim"></div><div class="aiq" id="aiq"></div><div class="air"><textarea id="ait" rows="2" placeholder="Что посчитать или изменить на доске?" aria-label="Запрос к ИИ"></textarea><button id="ais" aria-label="Отправить">▶</button></div><div class="aif"><button id="aiu" disabled>↶ Отменить правки ИИ</button><button id="aie" hidden>Исправить ошибки</button><button id="aist" hidden>Стоп</button></div></div>
<script>
const $=s=>document.querySelector(s);
const board=$('#board'),world=$('#world'),sheet=$('#sheet'),tsheet=$('#tsheet'),menu=$('#menu'),ta=$('#ta'),ff=$('#ff'),file=$('#file');
let regs=[],sel=null,root=[],cur={row:root,idx:0},reg=[],px=0,py=0,s=1,uid=0;
const parentOf=new WeakMap(),OPS='+-*/=≔<>≤≥≠',CARET='<span class="caret"></span>';

/* ---------- числа ---------- */
const B={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,ln:Math.log,log:Math.log10,exp:Math.exp,abs:Math.abs,sqrt:Math.sqrt};
const isM=a=>Array.isArray(a),need=a=>{if(!isM(a))throw Error('нужна матрица');return a};
const mm=(f,a,b)=>a.map((r,i)=>r.map((x,j)=>f(x,b[i][j])));
const mmul=(a,b)=>{if(a[0].length!==b.length)throw Error('размеры матриц не совпадают');return a.map(r=>b[0].map((_,j)=>r.reduce((s,x,k)=>s+x*b[k][j],0)))};
function dt(a){const n=a.length;if(n!==a[0].length)throw Error('нужна квадратная матрица');const m=a.map(r=>[...r]);let d=1;
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(m[r][i])>Math.abs(m[p][i]))p=r;if(m[p][i]===0)return 0;if(p!==i){[m[p],m[i]]=[m[i],m[p]];d=-d}d*=m[i][i];for(let r=i+1;r<n;r++){const f=m[r][i]/m[i][i];for(let c=i;c<n;c++)m[r][c]-=f*m[i][c]}}return d}
function iv(a){const n=a.length;if(n!==a[0].length)throw Error('нужна квадратная матрица');const m=a.map((r,i)=>[...r,...r.map((_,j)=>+(i===j))]);
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(m[r][i])>Math.abs(m[p][i]))p=r;if(Math.abs(m[p][i])<1e-12)throw Error('матрица вырождена');[m[p],m[i]]=[m[i],m[p]];const f=m[i][i];m[i]=m[i].map(x=>x/f);for(let r=0;r<n;r++)if(r!==i){const g=m[r][i];m[r]=m[r].map((x,c)=>x-g*m[i][c])}}return m.map(r=>r.slice(n))}
const MF={det:a=>isM(a)?dt(a):a,inv:a=>iv(need(a)),trn:a=>isM(a)?a[0].map((_,j)=>a.map(r=>r[j])):a};
class Q{constructor(v,d){this.v=v;this.d=d}}
const DM=(...a)=>[0,1,2,3,4].map(i=>a[i]||0),Z0=DM();
const U=(()=>{const L=DM(1),Ms=DM(0,1),Tm=DM(0,0,1),Fo=DM(1,1,-2),Pr=DM(-1,1,-2),En=DM(2,1,-2),Pw=DM(2,1,-3),Vo=DM(2,1,-3,-1),Am=DM(0,0,0,1);
  return{m:[1,L],mm:[1e-3,L],cm:[1e-2,L],km:[1e3,L],kg:[1,Ms],g:[1e-3,Ms],t:[1e3,Ms],s:[1,Tm],ms:[1e-3,Tm],min:[60,Tm],h:[3600,Tm],N:[1,Fo],kN:[1e3,Fo],MN:[1e6,Fo],Pa:[1,Pr],kPa:[1e3,Pr],MPa:[1e6,Pr],GPa:[1e9,Pr],bar:[1e5,Pr],J:[1,En],kJ:[1e3,En],MJ:[1e6,En],W:[1,Pw],kW:[1e3,Pw],MW:[1e6,Pw],V:[1,Vo],kV:[1e3,Vo],A:[1,Am],mA:[1e-3,Am],'Ω':[1,DM(2,1,-3,-2)],Hz:[1,DM(0,0,-1)],L:[1e-3,DM(3)],K:[1,DM(0,0,0,0,1)],deg:[Math.PI/180,Z0]}})();
const isU=c=>Object.prototype.hasOwnProperty.call(U,c);
const DN=[[DM(1,1,-2),'N'],[DM(-1,1,-2),'Pa'],[DM(2,1,-2),'J'],[DM(2,1,-3),'W'],[DM(2,1,-3,-1),'V'],[DM(2,1,-3,-2),'Ω'],[DM(0,0,-1),'Hz']];
const sameD=(a,b)=>a.every((x,i)=>Math.abs(x-b[i])<1e-9),dimsOf=a=>a instanceof Q?a.d:Z0,valOf=a=>a instanceof Q?a.v:a;
const qn=(v,d)=>d.every(x=>Math.abs(x)<1e-9)?v:new Q(v,d);
function dname(d){const k=DN.find(([x])=>sameD(x,d));if(k)return k[1];const nm=['m','kg','s','A','K'],p=[],n=[];
  d.forEach((e,i)=>{if(e>0)p.push(nm[i]+(e!==1?'^'+e:''));if(e<0)n.push(nm[i]+(e!==-1?'^'+(-e):''))});return(p.join('·')||'1')+(n.length?'/'+n.join('·'):'')}
function fmtQ(q){const k=DN.find(([x])=>sameD(x,q.d));let v=q.v,p='';
  if(k&&v){const a=Math.abs(v);if(a>=1e9){v/=1e9;p='G'}else if(a>=1e6){v/=1e6;p='M'}else if(a>=1e3){v/=1e3;p='k'}else if(a<1e-3){v*=1e6;p='µ'}else if(a<1){v*=1e3;p='m'}}
  return fmt(v)+' '+p+dname(q.d).replace(/\^([\d.]+)/g,'<sup>$1</sup>')}
function opQ(o,a,b){if(isM(a)||isM(b))throw Error('единицы в матрицах не поддерживаются');
  const A=a instanceof Q?a:{v:a,d:Z0},B2=b instanceof Q?b:{v:b,d:Z0};
  if(o==='+'||o==='-'){if(!sameD(A.d,B2.d))throw Error('несовместимые размерности: '+dname(A.d)+' и '+dname(B2.d));return qn(o==='+'?A.v+B2.v:A.v-B2.v,A.d)}
  if(o==='*')return qn(A.v*B2.v,A.d.map((x,i)=>x+B2.d[i]));
  if(o==='/')return qn(A.v/B2.v,A.d.map((x,i)=>x-B2.d[i]));
  if(b instanceof Q)throw Error('показатель степени должен быть безразмерным');
  return qn(A.v**b,A.d.map(x=>x*b))}
function fnQ(c,a){if(a instanceof Q){if(c==='sqrt')return qn(Math.sqrt(a.v),a.d.map(x=>x/2));if(c==='abs')return qn(Math.abs(a.v),a.d);throw Error('аргумент '+c+' должен быть безразмерным, а не '+dname(a.d))}return isM(a)?a.map(q=>q.map(B[c])):B[c](a)}
const NUMF={
  root:(f,a,b)=>{if(b===undefined)throw Error('root(f,a,b)');let lo=a,hi=b,flo=f(lo);const fhi=f(hi);if(flo===0)return lo;if(fhi===0)return hi;
    if(flo*fhi>0){let ok=false;for(let i=0;i<400;i++){const x0=a+(b-a)*i/400,x1=a+(b-a)*(i+1)/400,y0=f(x0),y1=f(x1);if(y0===0)return x0;if(y0*y1<0){lo=x0;hi=x1;flo=y0;ok=true;break}}if(!ok)throw Error('на отрезке нет смены знака')}
    for(let k=0;k<100;k++){const m=(lo+hi)/2,fm=f(m);if(fm===0)return m;if(flo*fm<0)hi=m;else{lo=m;flo=fm}}return(lo+hi)/2},
  int:(f,a,b)=>{if(b===undefined)throw Error('int(f,a,b)');const n=2000,h=(b-a)/n;let s=f(a)+f(b);for(let i=1;i<n;i++)s+=f(a+i*h)*(i%2?4:2);return s*h/3},
  dif:(f,x)=>{const h=1e-5*Math.max(1,Math.abs(x));return(f(x+h)-f(x-h))/(2*h)}};
function op(o,a,b){if(a instanceof Q||b instanceof Q)return opQ(o,a,b);const A=isM(a),M=isM(b);
  if(!A&&!M)return o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:o==='/'?a/b:a**b;
  if(o==='+'||o==='-'){const f=o==='+'?(x,y)=>x+y:(x,y)=>x-y;

    try{
      if(q.includes(':=')){const m=q.match(new RegExp('^('+IDR+')(?:[(]('+IDR+')[)])?:=(.*)$'));if(!m)throw Error('lhs');
        let rh=m[3];const ev=rh.endsWith('=');if(ev)rh=rh.slice(0,-1);
        const lhs=m[2]?`<ml:function>${mid(m[1])}<ml:boundVars>${mid(m[2])}</ml:boundVars></ml:function>`:mid(m[1]);
        const body=toMl(rh,fns);rs.push(reg(r,w,24,mth(`<ml:define>${lhs}${body}</ml:define>`)));
        if(ev&&!m[2])rs.push(reg(r,40,24,mth(`<ml:eval>${mid(m[1])}</ml:eval>`),w+12))}
      else if(q.length>1&&q.endsWith('='))rs.push(reg(r,w,24,mth(`<ml:eval>${toMl(q.slice(0,-1),fns)}</ml:eval>`)));
      else rs.push(reg(r,w,24,mth(toMl(q,fns))))
    }catch(e){fb++;rs.push(reg(r,w,24,txt([q])))}
  }
  const xml='<?xml version="1.0" encoding="UTF-8"?>\n<worksheet xmlns="http://schemas.mathsoft.com/worksheet30" xmlns:ws="http://schemas.mathsoft.com/worksheet30" xmlns:ml="http://schemas.mathsoft.com/math30" xmlns:u="http://schemas.mathsoft.com/units10" xmlns:p="http://schemas.mathsoft.com/provenance10">\n<regions>\n'+rs.join('\n')+'\n</regions>\n</worksheet>\n';
  if(new DOMParser().parseFromString(xml,'application/xml').getElementsByTagName('parsererror').length)return toast('Ошибка экспорта: получился некорректный XML');
  const how=await saveFile('worksheet.xmcd',xml,'worksheet.xmcd.txt');
  if(how)toast('Экспортировано регионов: '+rs.length+(skipped?'; не перенесены графики и картинки: '+skipped:'')+(fb?'; текстом: '+fb:'')+(how==='cap'?'. Файл сохранён как .txt — удалите «.txt» из имени, чтобы открыть в Mathcad':''))}
const pdfSvg=h=>h.replace(/class="gl"/g,'stroke="#e0dcea" stroke-width="1"').replace(/class="ax"/g,'stroke="#8a859c" stroke-width="1.3"').replace(/class="cv"/g,'stroke="#d4156b" fill="none" stroke-width="2.4" stroke-linejoin="round"').replace(/<text /g,'<text fill="#6f6a88" font-size="11" font-family="sans-serif" ');
async function expPdf(){
  if(!window.html2canvas||!window.jspdf)return toast('Библиотеки PDF не загрузились — проверьте интернет и повторите');
  toast('Готовлю PDF…');const sv=sel;if(sel)select(null);
  try{const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4',orientation:'portrait'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    for(let i=0;i<npages;i++){
      const c=document.createElement('div');c.className='exp';c.style.cssText=`width:${PW}px;height:${PH}px`;
      c.innerHTML=regs.filter(r=>r.y<(i+1)*PH&&r.y>i*PH-420).map(r=>`<div class="reg${r.type==='t'?' tx':''}" style="left:${r.x+20}px;top:${r.y-i*PH}px">${pdfSvg(regBody(r,false))}${r.val!=null?`<span class="rv">${fmtV(r.val)}</span>`:''}</div>`).join('');
      document.body.appendChild(c);
      const cv=await html2canvas(c,{scale:2,backgroundColor:'#fff',logging:false,useCORS:true,windowWidth:PW,windowHeight:PH});
      c.remove();if(i)doc.addPage();
      doc.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);
      doc.setFontSize(9);doc.setTextColor(120);doc.text((i+1)+' / '+npages,W/2,H-12,{align:'center'})}
    const how=await saveFile('worksheet.pdf',doc.output('arraybuffer'));if(how)toast('PDF готов')
  }catch(e){toast('Не удалось создать PDF: '+(e&&e.message||e))}
  if(sv)select(sv)}
const syncT=()=>{$('#sz').textContent=sel.size||22;$('#bb').classList.toggle('on',!!sel.b);$('#ii').classList.toggle('on',!!sel.i)};
const tset=f=>{if(!sel||sel.type!=='t')return;f(sel);syncT();draw();save()};
ta.oninput=()=>tset(r=>r.text=ta.value);ff.onchange=()=>tset(r=>r.font=ff.value);
tsheet.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s)tset(r=>r.size=Math.max(10,Math.min(120,(r.size||22)+(b.dataset.s==='+'?2:-2))));
  else if(b.id==='bb')tset(r=>r.b=!r.b);else if(b.id==='ii')tset(r=>r.i=!r.i);else if(b.id==='td')select(null)});

/* жесты: перетаскивание, панорама, щипок */
const ptr=new Map();let drag=null,pinch=0;
const pd=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])};
board.addEventListener('pointerdown',e=>{menu.hidden=true;if(e.target.closest('.x,.gz,.sl'))return;
  ptr.set(e.pointerId,[e.clientX,e.clientY]);board.setPointerCapture(e.pointerId);
  if(ptr.size===2){pinch=pd();drag=null;return}
  const el=e.target.closest('.reg'),r=el&&regs.find(q=>q.id===+el.dataset.id);
  drag={x:e.clientX,y:e.clientY,t:e.target,el,r,moved:0,ox:r?r.x:px,oy:r?r.y:py,rs:!!e.target.closest('.rs'),ow:(r&&r.w)||(r&&r.type==='g'?320:240)}});
board.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const d=pd(),[a,b]=[...ptr.values()];zoomAt(d/pinch,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch=d;return}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=1;
  if(drag.rs){const w=Math.max(120,Math.min(1200,drag.ow+dx/s));drag.r.w=w;drag.el.querySelector('.fig').style.width=w+'px'}
  else if(drag.r){drag.r.x=drag.ox+dx/s;drag.r.y=drag.oy+dy/s;drag.el.style.left=drag.r.x+'px';drag.el.style.top=drag.r.y+'px'}
  else{px=drag.ox+dx;py=drag.oy+dy;view()}});
const up=e=>{ptr.delete(e.pointerId);if(!drag)return;const d=drag;drag=null;
  if(d.moved){if(d.r){evalAll();draw()}save();return}
  if(d.r){if(sel!==d.r)select(d.r);else if(d.r.tree){placeCaret(d.t,e.clientX);draw()}}else select(null)};
board.addEventListener('pointerup',up);board.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);drag=null});
board.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)},{passive:false});
let slT=0;
world.addEventListener('input',e=>{const t=e.target;if(!t.classList||!t.classList.contains('sl')||!sel||!sel.tree)return;
  const q=ser(sel.tree),i=q.indexOf(':=');if(i<0)return;const v=String(+parseFloat(t.value).toFixed(6));
  root.length=0;[...q.slice(0,i)].forEach(c=>root.push({t:'c',v:c}));root.push({t:'c',v:'≔'});[...v].forEach(c=>root.push({t:'c',v:c}));
  cur=last(root);evalAll();refresh();clearTimeout(slT);slT=setTimeout(save,300)});
world.addEventListener('click',e=>{const z=e.target.closest('.gz button');
  if(z&&sel){sel.R=Math.min(1000,Math.max(.5,(sel.R||10)*+z.dataset.d));evalAll();draw();save();return}
  if(!e.target.closest('.x'))return;regs.splice(regs.indexOf(sel),1);select(null);evalAll();draw();save()});
$('#add').onclick=()=>menu.hidden=!menu.hidden;$('#pp').onclick=()=>goPage(curPage()-1);$('#pnx').onclick=()=>goPage(curPage()+1);$('#pn').onclick=()=>goPage(curPage());menu.onclick=e=>{const b=e.target.closest('button');if(b)add(b.dataset.a)};$('#zi').onclick=()=>zoomAt(1.2,innerWidth/2,innerHeight/2);$('#zo').onclick=()=>zoomAt(1/1.2,innerWidth/2,innerHeight/2);

/* ---------- клавиатура ---------- */
const FN=['sin','cos','tan','ln','exp','abs','log','det','inv','trn','root','int','dif'];
const UN=['m','mm','cm','km','kg','g','t','s','ms','min','h','N','kN','MN','Pa','kPa','MPa','GPa','bar','J','kJ','MJ','W','kW','MW','V','kV','A','mA','Ω','Hz','L','K','deg'];
const M1=['7','8','9','(',')','4','5','6','*','/','1','2','3','+','-','0','.','=','≔','F','x','y','π','Q','P'];
const M2=[...FN,...'abcdefghijklmnopqrstuvwxyz','π','≔'],M3=['L','R','B','C','T','D'];
const GR=[...'αβγδεζηθικλμνξρστυφχψω','Γ','Δ','Θ','Λ','Ξ','Σ','Φ','Ψ','Ω'];
const LBL={M:'▦','H+':'+ряд','V+':'+стлб','H-':'−ряд','V-':'−стлб','*':'×','/':'÷','-':'−',F:'<span class="fr"><span>□</span><span>□</span></span>',P:'<i>x</i><sup>n</sup>',Q:'√',L:'◀',R:'▶',B:'⌫',D:'✓',T:'abc'};
const AR={M:'Матрица','H+':'Добавить строку','V+':'Добавить столбец','H-':'Убрать строку','V-':'Убрать столбец',F:'Дробь',P:'Степень',Q:'Корень',L:'Влево',R:'Вправо',B:'Стереть',C:'Очистить',D:'Готово',T:'Буквы и функции','≔':'Присвоить'};
const kb=(l,el)=>$(el).innerHTML=l.map(k=>`<button type="button" data-k="${k}"${AR[k]?` aria-label="${AR[k]}"`:''} class="${'*/+-=≔'.includes(k)?'o ':''}${k.length>1&&!LBL[k]?'sm ':''}${k==='D'?'ok':''}">${LBL[k]||k}</button>`).join('');
kb(M1,'#k1');kb(M2,'#k2');kb(GR,'#k4');kb(UN,'#k6');kb(['M','H+','V+','H-','V-',','],'#k5');kb(M3,'#k3');
let alt=0;
function press(k){
  if(k==='T'){alt=(alt+1)%4;['#k1','#k2','#k4','#k6'].forEach((q,i)=>$(q).hidden=i!==alt);$('[data-k=T]').textContent=['abc','αβγ','ед.','123'][alt];return}
  if(k==='D')return select(null);
  if(k==='F')insFrac();else if(k==='P')insE('pow');else if(k==='Q')insE('sqrt');else if(k==='M')insMat();else if(/^[HV][+-]$/.test(k))matOp(k);
  else if(k==='L')left();else if(k==='R')right();else if(k==='B')back();
  else if(k==='C'){root.length=0;cur={row:root,idx:0}}
  else if(FN.includes(k)){[...k].forEach(ins);ins('(');ins(')');cur.idx--}else if(UN.includes(k))[...k].forEach(ins);
  else ins(k);
  evalAll();draw();save()}
sheet.addEventListener('mousedown',e=>e.preventDefault());
sheet.addEventListener('click',e=>{const b=e.target.closest('button');if(b)press(b.dataset.k)});
document.addEventListener('keydown',e=>{if(!sel||!sel.tree||/^(TEXTAREA|SELECT|INPUT)$/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;let h=1;
  if(/^[0-9.,+\-*=()<>a-zA-Z]$/.test(k))ins(k);else if(k===':')ins('≔');else if(k==='/')insFrac();else if(k==='^')insE('pow');
  else if(k==='Backspace')back();else if(k==='ArrowLeft')left();else if(k==='ArrowRight')right();
  else if(k==='ArrowUp')vert(-1);else if(k==='ArrowDown')vert(1);
  else if(k==='Enter'||k==='Escape')return select(null);else h=0;
  if(h){e.preventDefault();evalAll();draw();save()}});
